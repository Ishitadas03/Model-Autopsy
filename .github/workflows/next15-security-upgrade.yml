name: One-time Next.js security upgrade

on:
  push:
    branches: [feat/production-security-jobs-science]
    paths: ['.github/workflows/next15-security-upgrade.yml']

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.repository == 'Ishitadas03/Model-Autopsy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install supported security-patched Next.js 15 and Sharp
        run: |
          npm install --prefix frontend --save-exact next@15.5.29 eslint-config-next@15.5.29 sharp@0.35.5
          npm --prefix frontend ls next eslint-config-next sharp --depth=0
      - name: Commit exact dependencies and lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade Next.js to supported 15.5.29 and regenerate npm lockfile"
            git push origin HEAD:feat/production-security-jobs-science
          fi
