experiment:
  id: "E005"
  name: "Feature-Level Empirical Vulnerability Analysis Under Coordinate-Isolated Stress"
  protocol_version: "1.0.0"
  description: "Preregistered empirical feature vulnerability analysis (RQ3) measuring model degradation when single features are subjected to coordinate-isolated perturbations across Random Forest, Logistic Regression, and Gradient Boosted Trees."

dataset:
  name: "iris"
  source: "sklearn.datasets.load_iris"
  task_type: "multiclass_classification"
  n_instances: 150
  n_features: 4
  n_classes: 3
  split:
    method: "stratified_random"
    train_ratio: 0.80
    test_ratio: 0.20
    split_seed: 42

models:
  random_forest:
    family: "ensemble"
    adapter: "sklearn_rf"
    class_name: "RandomForestClassifier"
    preprocessing: "none"
    hyperparameters:
      n_estimators: 100
      max_depth: null
      criterion: "gini"
      min_samples_split: 2
      min_samples_leaf: 1
      bootstrap: true
  logistic_regression:
    family: "linear"
    adapter: "sklearn_logistic"
    class_name: "LogisticRegression"
    preprocessing: "standard_scaler"
    hyperparameters:
      penalty: "l2"
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000
  gradient_boosting:
    family: "boosting"
    adapter: "sklearn_gb"
    class_name: "GradientBoostingClassifier"
    preprocessing: "none"
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      subsample: 1.0
      criterion: "friedman_mse"

seeds:
  split_seed: 42
  dev_seed: 42
  research_seeds: [42, 123, 456, 789, 1011]

stress_tests:
  severities: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  primary_operator: "single_feature_gaussian_noise"
  corruptions:
    single_feature_gaussian_noise:
      type: "noise"
      family: "gaussian_noise"
      isolation: "coordinate_isolated"
      formula: "epsilon_i ~ Normal(0, (s * sigma_j^train)^2)"
      dispersion_source: "train_only"
    single_feature_missingness:
      type: "missingness"
      family: "mcar"
      isolation: "coordinate_isolated"
      formula: "M_i ~ Bernoulli(s), imputed with mu_j^train"
      imputation: "train_mean"
    single_feature_outliers:
      type: "outlier"
      family: "impulsive"
      isolation: "coordinate_isolated"
      formula: "O_i ~ Bernoulli(s), replaced with mu_j^train +/- 5.0 * sigma_j^train"
      displacement_factor: 5.0
      parameter_source: "train_only"

evaluation:
  primary_metric: "macro_f1"
  secondary_metrics: ["accuracy", "delta_abs", "delta_rel", "audc"]
  failure_threshold: 0.80
  strict_comparison: true
  relative_drop_diagnostic_threshold_pct: 15.0
  fdr_q_threshold: 0.05

artifacts:
  output_dir: "artifacts/experiments/E005"
  generate_plot: true
