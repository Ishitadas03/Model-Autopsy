[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-autopsy"
version = "0.1.0"
description = "Model Autopsy: Research-grade ML robustness testing, failure boundary detection, and stress evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["ml_engine/src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["ml_engine/src"]
testpaths = ["ml_engine/tests"]
addopts = "-v --tb=short"
