name: CI - Model Autopsy

on:
  pull_request:
    branches: [main, fix/production-data-integrity-guardrails]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      STORAGE_PROVIDER: auto
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ML engine and backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip install aiosqlite boto3 botocore 'sqlalchemy[asyncio]'
      - name: Run ML research tests
        run: pytest -q ml_engine/tests
      - name: Run backend tests
        working-directory: backend
        run: pytest -q tests

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCKS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Frontend unit tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build
