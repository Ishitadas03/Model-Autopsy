# EXAMPLE ONLY. Do not apply automatically: a Render background worker may be billable.
# After explicit approval, deploy this alongside the existing web service.
# Before starting, apply database migration 003_durable_jobs and verify R2.
services:
  - type: worker
    name: model-autopsy-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements-prod.txt"
    startCommand: "PYTHONPATH=backend python -m app.workers.experiment_worker"
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: JOB_EXECUTION_MODE
        value: worker
      - key: WORKER_POLL_SECONDS
        value: "3"
      - key: WORKER_LEASE_SECONDS
        value: "90"
      - key: EXPERIMENT_TIMEOUT_SECONDS
        value: "1800"
      - key: MAX_CONCURRENT_EXPERIMENTS
        value: "1"
      - key: STORAGE_PROVIDER
        value: r2
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: model-autopsy-artifacts
      - key: R2_ENDPOINT_URL
        sync: false
