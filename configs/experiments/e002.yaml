experiment:
  id: "E002"
  name: "Comparative Empirical Robustness Evaluation Across Diverse Input Corruption Mechanisms"
  protocol_version: "1.0.0"
  description: "Controlled empirical comparison of Random Forest robustness on Iris under additive Gaussian noise, MCAR feature missingness with mean imputation, and impulsive feature outlier contamination."

dataset:
  name: "iris"
  source: "sklearn.datasets.load_iris"
  task_type: "multiclass_classification"
  n_instances: 150
  n_features: 4
  n_classes: 3
  split:
    method: "stratified_random"
    train_ratio: 0.80
    test_ratio: 0.20
    split_seed: 42

model:
  family: "ensemble"
  adapter: "sklearn_rf"
  class_name: "RandomForestClassifier"
  hyperparameters:
    n_estimators: 100
    max_depth: null
    criterion: "gini"
    min_samples_split: 2
    min_samples_leaf: 1
    bootstrap: true
  dev_seed: 42
  research_seeds: [42, 123, 456, 789, 1011]

stress_tests:
  severities: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  corruptions:
    gaussian_noise:
      type: "noise"
      family: "gaussian_noise"
      formula: "epsilon_ij ~ Normal(0, (s * sigma_j)^2)"
      dispersion_source: "train_only"
    feature_missingness_mcar:
      type: "missingness"
      family: "mcar"
      formula: "M_ij ~ Bernoulli(s), imputed with mu_j^train"
      imputation: "train_mean"
    feature_outliers:
      type: "outlier"
      family: "impulsive"
      formula: "O_ij ~ Bernoulli(s), replaced with mu_j^train +/- 5.0 * sigma_j^train"
      displacement_factor: 5.0
      parameter_source: "train_only"

evaluation:
  primary_metric: "macro_f1"
  secondary_metrics: ["accuracy", "confusion_matrix"]
  failure_threshold: 0.80
  strict_comparison: true
  relative_drop_diagnostic_threshold_pct: 15.0

artifacts:
  output_dir: "artifacts/experiments/E002"
  generate_plot: true
